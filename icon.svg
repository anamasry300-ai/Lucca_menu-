<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1608"/>
      <stop offset="100%" stop-color="#1A0D04"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#B8893A"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="245" fill="url(#bg)" stroke="url(#gold)" stroke-width="6"/>

  <!-- Coffee saucer -->
  <ellipse cx="256" cy="340" rx="120" ry="18" fill="#D4A853" opacity="0.3"/>

  <!-- Coffee cup body -->
  <path d="M 190 240 L 196 330 C 196 340, 210 348, 256 348 C 302 348, 316 340, 316 330 L 322 240 Z"
        fill="#F5E6D3"/>

  <!-- Cup inner shadow -->
  <path d="M 196 245 L 200 325 C 200 333, 212 340, 256 340 C 300 340, 312 333, 312 325 L 316 245 Z"
        fill="#E8D5B8"/>

  <!-- Coffee surface -->
  <ellipse cx="256" cy="245" rx="63" ry="18" fill="#3C1F0E"/>

  <!-- Coffee highlight -->
  <ellipse cx="248" cy="242" rx="25" ry="7" fill="#4A2A14" opacity="0.6"/>

  <!-- Cup handle -->
  <path d="M 322 255 C 355 255, 370 280, 370 305 C 370 330, 355 340, 322 335"
        fill="none" stroke="#F5E6D3" stroke-width="12" stroke-linecap="round"/>

  <!-- Steam -->
  <path d="M 230 220 C 225 200, 240 185, 230 165"
        fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 256 215 C 251 195, 266 180, 256 160"
        fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 280 220 C 275 200, 290 185, 280 165"
        fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- Text: LUCCA -->
  <text x="256" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="52"
        font-weight="bold" fill="#D4A853" text-anchor="middle" letter-spacing="8">LUCCA</text>

  <!-- Text: CAFFÈ -->
  <text x="256" y="445" font-family="Georgia, 'Times New Roman', serif" font-size="28"
        font-style="italic" fill="#C8924A" text-anchor="middle" letter-spacing="4">CAFFÈ</text>

  <!-- Est. 2024 -->
  <text x="256" y="478" font-family="Georgia, 'Times New Roman', serif" font-size="10"
        fill="#8A6A3A" text-anchor="middle" letter-spacing="3">EST. 2024</text>
</svg>
