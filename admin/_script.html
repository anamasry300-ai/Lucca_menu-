<script>
let currentUser = null;
let dbReady = false;
let currentReportData = null;
let currentReportType = '';
let salesChartView = 'daily';

function todayStr(){ return new Date().toISOString().slice(0,10); }
function formatMoney(n){ return (Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:0}); }
function formatDate(d){ return d ? new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'}) : ''; }
function formatTime(d){ return d ? new Date(d).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}) : ''; }
function getServerUrl(){ return localStorage.getItem('luccaServerUrl') || 'http://localhost:3000'; }

function showToast(text, type){
    const t = document.getElementById('toast');
    t.textContent = text;
    t.className = 'toast ' + (type||'success');
    t.style.display = 'flex';
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>{ t.style.display = 'none'; }, 2500);
}

async function apiFetch(path){
    const url = getServerUrl() + '/api' + path;
    const key = localStorage.getItem('luccaApiKey') || '';
    const res = await fetch(url, { headers:{'x-api-key':key,'Content-Type':'application/json'}, signal: AbortSignal.timeout(8000) });
    if(!res.ok) throw new Error('API '+res.status);
    return res.json();
}

function getDateRange(){
    return { from: document.getElementById('dateFrom').value || todayStr(), to: document.getElementById('dateTo').value || todayStr() };
}

// ===== INIT =====
async function init(){
    try { await window.LuccaDB.initSystem(); dbReady = true; } catch(e){ console.error('Init failed',e); }
}

// ===== AUTH =====
async function doLogin(){
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;
    if(!user||!pass){ document.getElementById('loginError').textContent='أدخل بيانات صحيحة'; return; }
    try {
        const u = await window.LuccaDB.Users.login(user, pass);
        currentUser = u;
        document.getElementById('loginScreen').style.display='none';
        document.getElementById('app').style.display='flex';
        document.getElementById('userDisplayName').textContent = u.displayName || u.username;
        document.getElementById('userRoleDisplay').textContent = u.role || 'user';
        document.getElementById('userAvatar').textContent = (u.displayName||u.username||'U')[0].toUpperCase();
        initDateFilter();
        initTabs();
        refreshDashboard();
    } catch(e){ document.getElementById('loginError').textContent = 'خطأ في تسجيل الدخول'; }
}

function doLogout(){
    window.LuccaDB.Users.logout();
    currentUser = null;
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('app').style.display='none';
}

// ===== TABS =====
function initTabs(){
    document.querySelectorAll('.sidebar-link').forEach(link => {
        link.addEventListener('click', function(){
            const page = this.dataset.page;
            if(!page) return;
            document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
            const target = document.getElementById('page-'+page);
            if(target) target.classList.add('active');
            const loaders = {
                'dashboard': ()=>refreshDashboard(),
                'orders-page': ()=>loadOrders(),
                'tables-page': ()=>loadTables(),
                'categories-page': ()=>loadCategories(),
                'products-page': ()=>{ loadProducts(); populateProductSelects(); },
                'paymethods-page': ()=>loadPaymentMethods(),
                'employees-page': ()=>loadEmployees(),
                'attendance-page': ()=>loadAttendance(),
                'shifts-page': ()=>loadShifts(),
                'inventory-page': ()=>loadInventory(),
                'purchases-page': ()=>loadPurchases(),
                'expenses-page': ()=>loadExpenses(),
                'roles-page': ()=>loadRoleUsers(),
                'audit-page': ()=>loadAuditLogs(),
            };
            if(loaders[page]) loaders[page]();
        });
    });
}

function toggleSidebar(){
    document.getElementById('sidebar').classList.toggle('open');
}

// ===== DARK MODE =====
function toggleDarkMode(){
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('luccaDarkMode', document.documentElement.classList.contains('dark'));
}
(function(){ if(localStorage.getItem('luccaDarkMode')==='true') document.documentElement.classList.add('dark'); })();

// ===== DATE FILTER =====
function initDateFilter(){
    document.getElementById('dateFrom').value = todayStr();
    document.getElementById('dateTo').value = todayStr();
    document.querySelectorAll('.date-preset').forEach(btn => {
        btn.addEventListener('click', function(){
            document.querySelectorAll('.date-preset').forEach(b=>b.classList.remove('active'));
            this.classList.add('active');
            const r = this.dataset.range;
            const t = todayStr();
            let f = t;
            if(r==='yesterday'){ const d=new Date(); d.setDate(d.getDate()-1); f=d.toISOString().slice(0,10); }
            else if(r==='7d'){ const d=new Date(); d.setDate(d.getDate()-7); f=d.toISOString().slice(0,10); }
            else if(r==='30d'){ const d=new Date(); d.setDate(d.getDate()-30); f=d.toISOString().slice(0,10); }
            else if(r==='month'){ const d=new Date(); d.setDate(1); f=d.toISOString().slice(0,10); }
            document.getElementById('dateFrom').value = f;
            document.getElementById('dateTo').value = t;
            refreshDashboard();
        });
    });
}

function onDateFilterChange(){
    document.querySelectorAll('.date-preset').forEach(b=>b.classList.remove('active'));
    refreshDashboard();
}

// ===== GLOBAL SEARCH =====
function handleGlobalSearch(val){
    if(!val.trim()) return;
    document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.remove('active'));
    const pl = document.querySelector('[data-page="products-page"]');
    if(pl) pl.classList.add('active');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-products-page').classList.add('active');
    document.getElementById('prodSearch').value = val;
    loadProducts();
    searchProducts();
}

// ===== DASHBOARD =====
async function refreshDashboard(){
    const {from, to} = getDateRange();
    try {
        const [kpis, salesByDay, categories, payments, topProducts, liveOrders, tables, insights, alerts] = await Promise.all([
            apiFetch('/dashboard/kpis?from='+from+'&to='+to),
            apiFetch('/dashboard/sales-by-day?from='+from+'&to='+to),
            apiFetch('/dashboard/sales-by-category?from='+from+'&to='+to),
            apiFetch('/dashboard/payments?from='+from+'&to='+to),
            apiFetch('/dashboard/top-products?from='+from+'&to='+to+'&limit=8'),
            apiFetch('/dashboard/live-orders'),
            apiFetch('/dashboard/tables'),
            apiFetch('/dashboard/insights?from='+from+'&to='+to),
            apiFetch('/dashboard/alerts')
        ]);
        renderKPIs(kpis);
        renderSalesChart(salesByDay);
        renderCategoryAnalytics(categories);
        renderPaymentAnalytics(payments);
        renderTopProducts(topProducts);
        renderLiveOrders(liveOrders);
        renderTablesStatus(tables);
        renderInsights(insights);
        renderAlerts(alerts);
    } catch(e){
        document.getElementById('kpiGrid').innerHTML = '<div class="alert alert-danger">خطأ في تحميل البيانات: '+e.message+'</div>';
    }
}

function renderKPIs(d){
    const set = (id, val) => { const el=document.getElementById(id); if(el) el.textContent=val; };
    const setTrend = (id, change) => {
        const el = document.getElementById(id); if(!el) return;
        if(change===undefined||change===null){ el.textContent='—'; el.className='kpi-trend neutral'; return; }
        const v = Number(change);
        if(v > 0){ el.textContent='↑ '+v.toFixed(1)+'%'; el.className='kpi-trend up'; }
        else if(v < 0){ el.textContent='↓ '+Math.abs(v).toFixed(1)+'%'; el.className='kpi-trend down'; }
        else { el.textContent='— 0%'; el.className='kpi-trend neutral'; }
    };
    set('kpiSales', formatMoney(d.sales?.value||0));
    setTrend('kpiSalesTrend', d.sales?.change);
    set('kpiOrders', d.orders?.value||0);
    setTrend('kpiOrdersTrend', d.orders?.change);
    set('kpiAvgOrder', formatMoney(d.avgOrder?.value||0));
    setTrend('kpiAvgTrend', d.avgOrder?.change);
    set('kpiDiscounts', formatMoney(d.discounts?.value||0));
    set('kpiRefunds', formatMoney(d.refunds?.value||0));
    if(d.grossProfit) set('kpiProfit', formatMoney(d.grossProfit.value)+' ('+d.grossProfit.margin?.toFixed(1)+'%)');
    else set('kpiProfit', 'بيانات التكلفة غير متاحة');
}

function renderSalesChart(data){
    const body = document.getElementById('salesChartBody');
    if(!data||data.length===0){ body.innerHTML='<div class="empty-state"><div class="icon">📊</div><p>لا توجد بيانات مبيعات</p></div>'; return; }
    const max = Math.max(...data.map(d=>d.revenue||0), 1);
    const colors = ['#3B82F6','#60A5FA','#93C5FD','#2563EB','#1D4ED8'];
    let html = '<div class="bar-chart">';
    data.forEach((d,i)=>{
        const h = Math.max(((d.revenue||0)/max)*100, 2);
        const label = salesChartView==='monthly' ? (d.date||'').slice(0,7) : (d.date||'').slice(5);
        html += '<div class="bar-group"><div class="bar-value">'+formatMoney(d.revenue||0)+'</div><div class="bar" style="height:'+h+'%;background:'+colors[i%colors.length]+'"></div><div class="bar-label">'+label+'</div></div>';
    });
    html += '</div>';
    body.innerHTML = html;
}

function setChartView(view, btn){
    salesChartView = view;
    document.querySelectorAll('.chart-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    refreshDashboard();
}

function renderCategoryAnalytics(data){
    const el = document.getElementById('categoryAnalytics');
    if(!data||data.length===0){ el.innerHTML='<div class="empty-state"><div class="icon">📂</div><p>لا توجد بيانات</p></div>'; return; }
    const total = data.reduce((s,d)=>s+(d.revenue||0),0);
    const colors = ['#3B82F6','#10B981','#F59E0B','#EF4444','#8B5CF6','#EC4899','#14B8A6'];
    let gradParts = []; let acc = 0;
    data.slice(0,7).forEach((d,i)=>{
        const pct = total>0?(d.revenue/total*100):0;
        gradParts.push(colors[i]+' '+acc+'% '+(acc+pct)+'%');
        acc += pct;
    });
    let html = '<div style="text-align:center"><div class="donut-chart" style="background:conic-gradient('+gradParts.join(',')+')"></div></div>';
    html += '<div class="donut-legend">';
    data.slice(0,7).forEach((d,i)=>{
        const pct = total>0?(d.revenue/total*100).toFixed(1):0;
        html += '<div class="legend-item"><div class="legend-dot" style="background:'+colors[i]+'"></div>'+d.name+' — '+formatMoney(d.revenue)+' ('+pct+'%)</div>';
    });
    html += '</div>';
    el.innerHTML = html;
}

function renderPaymentAnalytics(data){
    const el = document.getElementById('paymentAnalytics');
    if(!data||data.length===0){ el.innerHTML='<div class="empty-state"><div class="icon">💳</div><p>لا توجد بيانات</p></div>'; return; }
    const methodNames = {cash:'كاش',card:'كارت',digital:'رقمي',other:'أخرى',split:'مقسم'};
    const colors = ['#10B981','#3B82F6','#8B5CF6','#F59E0B','#EF4444'];
    let gradParts = []; let acc = 0;
    data.forEach((d,i)=>{
        const pct = d.percentage||0;
        gradParts.push(colors[i%colors.length]+' '+acc+'% '+(acc+pct)+'%');
        acc += pct;
    });
    let html = '<div style="text-align:center"><div class="donut-chart" style="background:conic-gradient('+gradParts.join(',')+')"></div></div>';
    html += '<div class="donut-legend">';
    data.forEach((d,i)=>{
        html += '<div class="legend-item"><div class="legend-dot" style="background:'+colors[i%colors.length]+'"></div>'+(methodNames[d.method]||d.method)+' — '+formatMoney(d.total)+' ('+(d.percentage||0).toFixed(1)+'%)</div>';
    });
    html += '</div>';
    el.innerHTML = html;
}

function renderTopProducts(data){
    const el = document.getElementById('topProductsPanel');
    if(!data||data.length===0){ el.innerHTML='<div class="empty-state"><div class="icon">🏆</div><p>لا توجد بيانات</p></div>'; return; }
    let html = '<table class="data-table"><thead><tr><th>#</th><th>المنتج</th><th>القسم</th><th>الكمية</th><th>الإيراد</th></tr></thead><tbody>';
    data.forEach((d,i)=>{
        html += '<tr><td>'+(i+1)+'</td><td>'+d.name+'</td><td><span class="badge badge-info">'+(d.category||'—')+'</span></td><td>'+d.quantity+'</td><td>'+formatMoney(d.revenue)+'</td></tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;
}

function renderLiveOrders(data){
    const el = document.getElementById('liveOrdersPanel');
    if(!data||data.length===0){ el.innerHTML='<div class="empty-state"><div class="icon">✅</div><p>لا توجد طلبات نشطة</p></div>'; return; }
    const statusMap = {pending:'⏳ قيد الانتظار',in_preparation:'🔥 قيد التحضير',ready:'✅ جاهز',served:'🍽️ تم التقديم'};
    let html = '<table class="data-table"><thead><tr><th>رقم</th><th>الطاولة</th><th>الإجمالي</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody>';
    data.forEach(d=>{
        const st = d.status||'pending';
        const cls = st==='pending'?'badge-warning':st==='in_preparation'?'badge-danger':st==='ready'?'badge-success':'badge-info';
        html += '<tr><td>'+(d.orderNumber||d.id)+'</td><td>'+(d.tableId||'—')+'</td><td>'+formatMoney(d.total)+'</td><td><span class="badge '+cls+'">'+(statusMap[st]||st)+'</span></td><td>'+formatTime(d.createdAt)+'</td></tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;
}

function renderTablesStatus(data){
    const el = document.getElementById('tablesStatusPanel');
    if(!data||!data.tables||data.tables.length===0){ el.innerHTML='<div class="empty-state"><div class="icon">🪑</div><p>لا توجد طاولات</p></div>'; return; }
    let html = '<div class="table-grid">';
    data.tables.forEach(t=>{
        const st = t.status||'available';
        html += '<div class="table-cell '+st+'"><div style="font-size:1.2rem;font-weight:800">'+t.number+'</div><div style="font-size:0.7rem;opacity:0.7">'+(t.capacity||'')+' أشخاص</div></div>';
    });
    html += '</div>';
    if(data.summary&&data.summary.length){
        html += '<div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap">';
        data.summary.forEach(s=>{
            const label = s.status==='available'?'متاحة':s.status==='occupied'?'مشغولة':s.status==='reserved'?'محجوزة':s.status;
            const cls = s.status==='available'?'badge-success':s.status==='occupied'?'badge-danger':'badge-warning';
            html += '<span class="badge '+cls+'">'+label+': '+s.count+'</span>';
        });
        html += '</div>';
    }
    el.innerHTML = html;
}

function renderInsights(data){
    const el = document.getElementById('insightsPanel');
    if(!data||data.length===0){ el.innerHTML='<div class="empty-state"><div class="icon">💡</div><p>لا توجد رؤى حالياً</p></div>'; return; }
    let html = '';
    data.forEach(d=>{
        const icon = d.severity==='success'?'✅':d.severity==='warning'?'⚠️':d.severity==='danger'?'🚨':'💡';
        html += '<div class="insight-card"><span>'+icon+'</span><span>'+d.message+'</span></div>';
    });
    el.innerHTML = html;
}

function renderAlerts(data){
    const el = document.getElementById('alertsPanel');
    if(!data||data.length===0){ el.innerHTML=''; return; }
    let html = '';
    data.forEach(d=>{
        html += '<div class="alert alert-'+(d.severity==='danger'?'danger':'warning')+'">'+d.message+'</div>';
    });
    el.innerHTML = html;
}

// ===== ORDERS =====
async function loadOrders(){
    const from = document.getElementById('ordersDateFrom').value || todayStr();
    const to = document.getElementById('ordersDateTo').value || todayStr();
    const status = document.getElementById('ordersStatusFilter').value;
    try {
        const orders = await window.LuccaDB.Orders.getByDateRange(from, to);
        let filtered = status ? orders.filter(o=>o.status===status) : orders;
        filtered.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
        const total = filtered.reduce((s,o)=>s+(o.total||0),0);
        const avg = filtered.length ? total/filtered.length : 0;
        const cancelled = filtered.filter(o=>o.status==='cancelled').length;
        document.getElementById('ordersKpiCount').textContent = filtered.length;
        document.getElementById('ordersKpiTotal').textContent = formatMoney(total);
        document.getElementById('ordersKpiAvg').textContent = formatMoney(avg);
        document.getElementById('ordersKpiCancelled').textContent = cancelled;
        const tbody = document.getElementById('ordersBody');
        if(!filtered.length){ tbody.innerHTML='<tr><td colspan="8" style="text-align:center;padding:20px;color:var(--text-muted)">لا توجد طلبات</td></tr>'; return; }
        const stMap = {pending:'⏳ قيد الانتظار',in_preparation:'🔥 قيد التحضير',ready:'✅ جاهز',served:'🍽️ تم التقديم',closed:'🔒 مغلق',cancelled:'❌ ملغي'};
        tbody.innerHTML = filtered.map(o=>{
            const st = o.status||'pending';
            const cls = st==='closed'?'badge-success':st==='cancelled'?'badge-danger':st==='ready'?'badge-success':st==='in_preparation'?'badge-danger':'badge-warning';
            return '<tr><td>'+(o.orderNumber||o.id)+'</td><td>'+(o.tableId||'—')+'</td><td>'+(o.customerName||'—')+'</td><td>'+formatMoney(o.total)+'</td><td>'+(o.paymentMethod||'—')+'</td><td><span class="badge '+cls+'">'+(stMap[st]||st)+'</span></td><td>'+formatDate(o.date)+'</td><td><button class="btn btn-ghost btn-sm" onclick="viewOrderDetails(\''+o.id+'\')">تفاصيل</button></td></tr>';
        }).join('');
    } catch(e){ document.getElementById('ordersBody').innerHTML='<tr><td colspan="8" style="color:var(--danger)">'+e.message+'</td></tr>'; }
}

function viewOrderDetails(id){
    window.LuccaDB.db.get('orders', Number(id)||id).then(o=>{
        if(!o){ showToast('الطلب غير موجود','error'); return; }
        const items = JSON.parse(o.items||'[]');
        let msg = 'طلب #'+(o.orderNumber||o.id)+'\nالطاولة: '+(o.tableId||'—')+'\nالعميل: '+(o.customerName||'—')+'\nالحالة: '+o.status+'\nالدفع: '+(o.paymentMethod||'—')+'\n\nالمنتجات:\n';
        items.forEach(i=>{ msg += '  • '+i.name+' × '+i.quantity+' = '+formatMoney(i.total||i.quantity*(i.unitPrice||i.price||0))+'\n'; });
        msg += '\nالإجمالي: '+formatMoney(o.total);
        alert(msg);
    });
}

// ===== TABLES =====
async function loadTables(){
    try {
        const tables = await window.LuccaDB.Tables.getAll();
        const tbody = document.getElementById('tablesBody');
        if(!tables.length){ tbody.innerHTML='<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-muted)">لا توجد طاولات</td></tr>'; return; }
        const stLabels = {available:'✅ متاحة',occupied:'🔴 مشغولة',reserved:'🟡 محجوزة'};
        const stCls = {available:'badge-success',occupied:'badge-danger',reserved:'badge-warning'};
        tbody.innerHTML = tables.map(t=>{
            const st = t.status||'available';
            return '<tr><td>'+t.number+'</td><td>'+(t.capacity||'—')+'</td><td>'+(t.zone||'—')+'</td><td><span class="badge '+(stCls[st]||'badge-neutral')+'">'+(stLabels[st]||st)+'</span></td><td><button class="btn btn-ghost btn-sm" onclick="editTableModal(\''+t.id+'\')">✏️</button> <button class="btn btn-ghost btn-sm" onclick="deleteTable(\''+t.id+'\')">🗑️</button></td></tr>';
        }).join('');
    } catch(e){ showToast('خطأ: '+e.message,'error'); }
}

async function addTable(){
    const num = document.getElementById('tableNumber').value;
    const cap = document.getElementById('tableCapacity').value;
    const zone = document.getElementById('tableZone').value.trim();
    if(!num){ showToast('أدخل رقم الطاولة','error'); return; }
    try {
        await window.LuccaDB.Tables.add({ number:Number(num), capacity:Number(cap)||4, zone:zone||null, status:'available' });
        document.getElementById('tableNumber').value='';
        loadTables(); showToast('تمت الإضافة');
    } catch(e){ showToast('خطأ: '+e.message,'error'); }
}

async function editTableModal(id){
    const t = await window.LuccaDB.Tables.getById(Number(id)||id);
    if(!t) return;
    const num = prompt('رقم الطاولة:', t.number);
    if(num===null) return;
    const cap = prompt('السعة:', t.capacity);
    const zone = prompt('المنطقة:', t.zone||'');
    try {
        await window.LuccaDB.Tables.update(Number(id)||id, { number:Number(num), capacity:Number(cap)||t.capacity, zone:zone||null });
        loadTables(); showToast('تم التحديث');
    } catch(e){ showToast('خطأ: '+e.message,'error'); }
}

async function deleteTable(id){
    if(!confirm('حذف الطاولة؟')) return;
    try { await window.LuccaDB.Tables.delete(Number(id)||id); loadTables(); showToast('تم الحذف'); } catch(e){ showToast('خطأ: '+e.message,'error'); }
}

// ===== CATEGORIES =====
async function loadCategories(){
    try {
        const cats = await window.LuccaDB.Categories.getAll();
        const tbody = document.getElementById('categoriesBody');
        if(!cats.length){ tbody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text-muted)">لا توجد أقسام</td></tr>'; return; }
        tbody.innerHTML = cats.map(c=>{
            const active = c.active!==0 && c.active!==false;
            return '<tr><td>'+(c.icon||'📂')+'</td><td>'+(c.nameAr||c.name||'')+'</td><td>'+(c.nameEn||'')+'</td><td>'+(c.sortOrder||0)+'</td><td><span class="badge '+(active?'badge-success':'badge-neutral')+'">'+(active?'نشط':'معطل')+'</span></td><td><button class="btn btn-ghost btn-sm" onclick="editCategoryModal(\''+c.id+'\')">✏️</button> <button class="btn btn-ghost btn-sm" onclick="toggleCategory(\''+c.id+'\','+(active?0:1)+')">'+(active?'🔒':'🔓')+'</button> <button class="btn btn-ghost btn-sm" onclick="deleteCategory(\''+c.id+'\')">🗑️</button></td></tr>';
        }).join('');
    } catch(e){ showToast('خطأ: '+e.message,'error'); }
}

async function addCategory(){
    const nameAr = document.getElementById('catNameAr').value.trim();
    const nameEn = document.getElementById('catNameEn').value.trim();
    const icon = document.getElementById('catIcon').value.trim();
    const sort = document.getElementById('catSort').value;

async function loadProducts(){

        const search = (document.getElementById('prodSearch')?.value||'').toLowerCase();
        const filterCat = document.getElementById('prodFilterCat')?.value;
        let filtered = prods;
        if(search) filtered = filtered.filter(p=>(p.name||p.nameAr||'').toLowerCase().includes(search)||(p.nameEn||'').toLowerCase().includes(search));
        if(filterCat) filtered = filtered.filter(p=>String(p.categoryId)===String(filterCat));

            const price = Number(p.price)||0; const cost = Number(p.costPrice)||0; const profit = price-cost;

}

function exportReportCSV(){
    if(!currentReportData||!Array.isArray(currentReportData)||!currentReportData.length){ showToast('لا توجد بيانات للتصدير','error'); return; }
    const keys = Object.keys(currentReportData[0]).filter(k=>typeof currentReportData[0][k]!=='object');
    let csv = '\uFEFF' + keys.join(',') + '\n';
    currentReportData.forEach(row=>{
        csv += keys.map(k=>'"'+String(row[k]||'').replace(/"/g,'""')+'"').join(',') + '\n';
    });
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'report-'+currentReportType+'-'+todayStr()+'.csv';
    a.click(); URL.revokeObjectURL(url);
}

// ===== ROLES =====
async function loadRoleUsers(){
    try {
        const users = await window.LuccaDB.Users.getAll();
        const tbody = document.getElementById('rolesBody');
        if(!users.length){ tbody.innerHTML='<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text-muted)">لا يوجد مستخدمون</td></tr>'; return; }
        const roleLabels = {cashier:'كاشير',manager:'مدير',admin:'مدير النظام',kitchen:'مطبخ'};
        tbody.innerHTML = users.map(u=>'<tr><td>'+(u.username||'')+'</td><td>'+(u.displayName||u.username||'')+'</td><td><span class="badge badge-info">'+(roleLabels[u.role]||u.role||'—')+'</span></td><td><button class="btn btn-ghost btn-sm" onclick="editUserRole(\''+u.id+'\')">✏️</button></td></tr>').join('');
    } catch(e){ showToast('خطأ: '+e.message,'error'); }
}

async function addRoleUser(){
    const username = document.getElementById('roleUsername').value.trim();
    const displayName = document.getElementById('roleDisplayName').value.trim();
    const password = document.getElementById('rolePassword').value;
    const role = document.getElementById('roleSelect').value;
    if(!username||!password){ showToast('أدخل اسم المستخدم وكلمة المرور','error'); return; }
    try {
        await window.LuccaDB.Users.add({ username, displayName:displayName||username, password, role });
        ['roleUsername','roleDisplayName','rolePassword'].forEach(id=>document.getElementById(id).value='');
        loadRoleUsers(); showToast('تمت الإضافة');
    } catch(e){ showToast('خطأ: '+e.message,'error'); }
}

async function editUserRole(userId){
    const roles = ['cashier','manager','admin','kitchen'];
    const roleLabels = {cashier:'كاشير',manager:'مدير',admin:'مدير النظام',kitchen:'مطبخ'};
    const newRole = prompt('الدور الجديد (cashier/manager/admin/kitchen):');
    if(!newRole||!roles.includes(newRole)) return;
    try {
        await window.LuccaDB.Users.getAll().then(async users=>{
            const u = users.find(x=>String(x.id)===String(userId));
            if(u){ await window.LuccaDB.db.put('users', {...u, role:newRole}); }
        });
        loadRoleUsers(); showToast('تم التحديث');
    } catch(e){ showToast('خطأ: '+e.message,'error'); }
}

// ===== AUDIT LOG =====
async function loadAuditLogs(){
    try {
        const from = document.getElementById('auditDateFrom').value;
        const to = document.getElementById('auditDateTo').value;
        let logs = await window.LuccaDB.AuditLogs.getAll();
        if(from) logs = logs.filter(l=>(l.createdAt||l.date||'').slice(0,10)>=from);
        if(to) logs = logs.filter(l=>(l.createdAt||l.date||'').slice(0,10)<=to);
        logs.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
        logs = logs.slice(0,100);
        const tbody = document.getElementById('auditBody');
        if(!logs.length){ tbody.innerHTML='<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-muted)">لا توجد سجلات</td></tr>'; return; }
        const actionLabels = {create:'إنشاء',update:'تعديل',delete:'حذف'};
        tbody.innerHTML = logs.map(l=>'<tr><td>'+formatDate(l.createdAt||l.date)+'</td><td>'+(l.userName||l.userId||'—')+'</td><td>'+(actionLabels[l.action]||l.action||'—')+'</td><td>'+(l.objectType||'—')+'</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(l.objectId||'—')+'</td></tr>').join('');
    } catch(e){ showToast('خطأ: '+e.message,'error'); }
}

// ===== PRINTER =====
const AdminPrinter = {
    device: null, port: null, writer: null, connected: false, connType: null,
    init(){
        const saved = localStorage.getItem('luccaPrinterSettings');
        if(saved) document.getElementById('printerStatus').textContent = 'تم حفظ إعدادات الطابعة سابقاً';
    },
    updateUI(){
        const st = document.getElementById('printerStatus');
        if(this.connected) st.innerHTML = '<span style="color:var(--success)">✅ متصلة ('+this.connType+')</span>';
        else st.textContent = 'غير متصلة';
    }
};

async function connectAdminPrinter(){
    if(navigator.usb){
        try {
            const device = await navigator.usb.requestDevice({filters:[]});
            await device.open();
            if(device.configuration===null) await device.selectConfiguration(1);
            const iface = device.configuration.interfaces[0];
            await device.claimInterface(iface.interfaceNumber);
            AdminPrinter.device = device;
            AdminPrinter.connected = true;
            AdminPrinter.connType = 'USB';
            AdminPrinter.updateUI();
            showToast('تم توصيل الطابعة عبر USB');
        } catch(e){ showToast('فشل التوصيل: '+e.message,'error'); }
    } else if('serial' in navigator){
        try {
            const port = await navigator.serial.requestPort();
            await port.open({baudRate:9600});
            AdminPrinter.port = port;
            AdminPrinter.writer = port.writable.getWriter();
            AdminPrinter.connected = true;
            AdminPrinter.connType = 'Serial';
            AdminPrinter.updateUI();
            showToast('تم توصيل الطابعة عبر Serial');
        } catch(e){ showToast('فشل التوصيل: '+e.message,'error'); }
    } else {
        showToast('المتصفح لا يدعم توصيل الطابعة','error');
    }
}

async function testAdminPrinter(){
    if(!AdminPrinter.connected){ showToast('الطابعة غير متصلة','error'); return; }
    try {
        const cmd = [0x1B, 0x40, 0x1B, 0x61, 0x01, 0x1D, 0x21, 0x11, 0x0A, 0x4C, 0x55, 0x43, 0x43, 0x41, 0x0A, 0x1D, 0x21, 0x00, 0x0A, 0x54, 0x65, 0x73, 0x74, 0x20, 0x50, 0x72, 0x69, 0x6E, 0x74, 0x0A, 0x0A, 0x0A, 0x1D, 0x56, 0x41];
        if(AdminPrinter.connType==='USB'){
            const iface = AdminPrinter.device.configuration.interfaces[0];
            const ep = iface.alternate.endpoints.find(e=>e.direction==='out');
            await AdminPrinter.device.transferOut(ep.endpointNumber, new Uint8Array(cmd));
        } else {
            await AdminPrinter.writer.write(new Uint8Array(cmd));
        }
        showToast('تم إرسال أمر الطباعة التجريبية');
    } catch(e){ showToast('خطأ في الطباعة: '+e.message,'error'); }
}
