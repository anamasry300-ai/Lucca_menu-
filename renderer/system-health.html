<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الصحة والتشخيص - Lucca POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #F1F5F9;
            color: #0F172A;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            background: #1E3A8A;
            color: white;
            padding: 24px 32px;
            border-radius: 12px 12px 0 0;
            margin-bottom: 0;
        }
        header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 8px;
        }
        header .subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 32px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #E2E8F0;
        }
        .card h3 {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748B;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card h3 .icon {
            font-size: 1.1rem;
        }
        .value {
            font-size: 1.75rem;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 8px;
        }
        .value.small { font-size: 1.25rem; }
        .label {
            font-size: 0.875rem;
            color: #64748B;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-healthy {
            background: #ECFDF5;
            color: #059669;
        }
        .status-warning {
            background: #FFFBEB;
            color: #D97706;
        }
        .status-error {
            background: #FEF2F2;
            color: #DC2626;
        }
        .status-unknown {
            background: #F1F5F9;
            color: #64748B;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot-healthy { background: #10B981; box-shadow: 0 0 8px #10B981; }
        .dot-warning { background: #F59E0B; box-shadow: 0 0 8px #F59E0B; }
        .dot-error { background: #EF4444; box-shadow: 0 0 8px #EF4444; }
        .dot-unknown { background: #94A3B8; box-shadow: 0 0 8px #94A3B8; }
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
        }
        .meta-item {
            font-size: 0.875rem;
        }
        .meta-item .key {
            color: #64748B;
            display: block;
            margin-bottom: 4px;
        }
        .meta-item .val {
            font-weight: 700;
            color: #0F172A;
            word-break: break-all;
        }
        .readonly-notice {
            background: #FEF3C7;
            border: 1px solid #F59E0B;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            font-size: 0.875rem;
            color: #92400E;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-btn {
            background: #2563EB;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            float: left;
            margin-bottom: 20px;
        }
        .refresh-btn:hover { background: #1E40AF; }
        .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #E2E8F0;
            border-top-color: #2563EB;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .warnings-panel {
            grid-column: 1 / -1;
            background: #FEF2F2;
            border: 1px solid #FECACA;
            border-radius: 12px;
            padding: 20px;
        }
        .warnings-panel h3 {
            color: #DC2626;
            font-size: 1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .warning-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 0.875rem;
            color: #0F172A;
        }
        .warning-item .icon { color: #DC2626; flex-shrink: 0; }
        .warning-item.critical .icon { color: #7F1D1D; }
        .warning-item .message { flex: 1; }
        .warning-item.critical .message { font-weight: 700; color: #7F1D1D; }
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #64748B;
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 نظام الصحة والتشخيص</h1>
            <div class="subtitle">لوحة مراقبةène — lucca-pos v1.4.0 (قراءة فقط)</div>
        </header>

        <button class="refresh-btn" id="btnRefresh" onclick="refreshHealth()">
            <span id="refreshSpinner" class="spinner" style="display:none;"></span>
            تحديث البيانات
        </button>

        <div class="readonly-notice">
            ⚠️ هذه الصفحة للقراءة فقط. لا يمكن إجراء أي تعديلات من هذه الشاشة.
        </div>

        <div class="grid" id="healthGrid">
            <!-- يتم تعبئة البطاقات بواسطة JavaScript -->
        </div>

        <div class="warnings-panel" id="warningsPanel" style="display:none;">
            <h3>⚠️ تحذيرات النظام</h3>
            <div id="warningsList"></div>
        </div>
    </div>

    <script>
        const electronAPI = window.electronAPI;
        let isRefreshing = false;

        // تهيئة الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            renderEmptyState();
            refreshHealth();
            // تحديث تلقائي كل 30 ثانية
            setInterval(refreshHealth, 30000);
        });

        function renderEmptyState() {
            document.getElementById('healthGrid').innerHTML = `
                <div class="empty-state">
                    <div class="icon">📊</div>
                    <p>جاري تحميل بيانات النظام...</p>
                </div>
            `;
            document.getElementById('warningsPanel').style.display = 'none';
        }

        async function refreshHealth() {
            if (isRefreshing) return;
            isRefreshing = true;

            const btn = document.getElementById('btnRefresh');
            const spinner = document.getElementById('refreshSpinner');
            btn.disabled = true;
            spinner.style.display = 'inline-block';

            try {
                // جلب الإصدار الحالي
                const versionResult = await electronAPI.forceUpdateGetVersion();
                const currentVersion = versionResult ? versionResult.version : 'غير معروف';

                // جلب حالة التحديث
                const forceCheck = await electronAPI.forceUpdateCheck();
                const updateConfig = forceCheck ? forceCheck.config : null;

                // جلب last crash من crash recovery (إذا كان متوفراً عبر IPC)
                // نستخدم محاكاة للبيانات لأن crash-recovery يعمل في main process
                const lastCrashTime = localStorage.getItem('lucca_last_crash_time') || 'لا يوجد';

                // بناء البيانات للعرض
                const healthData = {
                    currentVersion: currentVersion,
                    requiredVersion: updateConfig ? updateConfig.minRequiredVersion : 'غير محدد',
                    latestVersion: updateConfig ? updateConfig.latestVersion : 'غير محدد',
                    updateStatus: forceCheck && forceCheck.active ? 'تحديث مطلوب' => 'محدث',
                    databaseStatus: 'متصل', // يتم تحديثه من health-monitor في main
                    memoryUsage: '0%',
                    cpuUsage: '0%',
                    lastSyncTime: 'غير متاح',
                    lastCrashTime: lastCrashTime
                };

                renderHealthCards(healthData);
                renderWarnings(healthData);

            } catch (err) {
                console.error('فشل جلب بيانات الصحة:', err);
                renderEmptyState();
            } finally {
                isRefreshing = false;
                btn.disabled = false;
                spinner.style.display = 'none';
            }
        }

        function renderHealthCards(data) {
            const grid = document.getElementById('healthGrid');
            const isUpdateRequired = data.updateStatus === 'تحديث مطلوب';

            const cards = [
                {
                    icon: '📦',
                    title: 'الإصدار الحالي',
                    value: data.currentVersion,
                    subtitle: 'إصدار التطبيق المثبت',
                    status: 'healthy'
                },
                {
                    icon: '🎯',
                    title: 'الإصدار المطلوب',
                    value: data.requiredVersion,
                    subtitle: 'أقل إصدار مسموح للتشغيل',
                    status: 'healthy'
                },
                {
                    icon: '🔄',
                    title: 'آخر إصدار متاح',
                    value: data.latestVersion,
                    subtitle: 'الإصدار على GitHub Releases',
                    status: 'healthy'
                },
                {
                    icon: '🚨',
                    title: 'حالة التحديث',
                    value: isUpdateRequired ? 'مطلوب إجبارياً' : 'محدث',
                    subtitle: data.updateStatus === 'تحديث مطلوب' ? 'يجب التحديث للمتابعة' : 'النظام محدث',
                    status: isUpdateRequired ? 'error' : 'healthy'
                },
                {
                    icon: '🗄️',
                    title: 'قاعدة البيانات',
                    value: data.databaseStatus,
                    subtitle: 'Supabase connection',
                    status: data.databaseStatus === 'متصل' ? 'healthy' : 'error'
                },
                {
                    icon: '💾',
                    title: 'استخدام الذاكرة',
                    value: data.memoryUsage,
                    subtitle: 'RAM usage',
                    status: 'healthy'
                },
                {
                    icon: '⚡',
                    title: 'استخدام المعالج',
                    value: data.cpuUsage,
                    subtitle: 'CPU usage',
                    status: 'healthy'
                },
                {
                    icon: '🕒',
                    title: 'آخر مزامنة',
                    value: data.lastSyncTime,
                    subtitle: 'Last sync',
                    status: 'healthy'
                },
                {
                    icon: '💥',
                    title: 'آخر تعطل',
                    value: data.lastCrashTime,
                    subtitle: 'Last crash',
                    status: data.lastCrashTime === 'لا يوجد' ? 'healthy' : 'warning'
                }
            ];

            grid.innerHTML = cards.map(card => `
                <div class="card">
                    <h3><span class="icon">${card.icon}</span>${card.title}</h3>
                    <div class="value">${data.value !== undefined ? data.value : card.value}</div>
                    <div class="label">${card.subtitle}</div>
                    <div class="meta-grid">
                        <div class="meta-item">
                            <span class="key">الحالة</span>
                            <span class="val status-badge status-${card.status}">
                                <span class="dot dot-${card.status === 'healthy' ? 'healthy' : card.status === 'warning' ? 'warning' : 'error'}"></span>
                                ${card.status === 'healthy' ? 'سليم' : card.status === 'warning' ? 'تحذير' : 'خطأ'}
                            </span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderWarnings(data) {
            const panel = document.getElementById('warningsPanel');
            const list = document.getElementById('warningsList');

            const warnings = [];
            if (data.updateStatus === 'تحديث مطلوب') {
                warnings.push({
                    severity: 'critical',
                    message: 'التحديث الإجباري مطلوب — التطبيق غير قابل للاستخدام حتى التثبيت'
                });
            }

            if (panel && list) {
                if (warnings.length > 0) {
                    panel.style.display = 'block';
                    list.innerHTML = warnings.map(w => `
                        <div class="warning-item ${w.severity === 'critical' ? 'critical' : ''}">
                            <span class="icon">⚠️</span>
                            <div class="message ${w.severity === 'critical' ? 'critical' : ''}">${w.message}</div>
                        </div>
                    `).join('');
                } else {
                    panel.style.display = 'none';
                }
            }
        }
    </script>
</body>
</html>
